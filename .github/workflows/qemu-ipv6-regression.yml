name: QEMU IPv6 Regression

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  shell-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Bash syntax check
        shell: bash
        run: |
          set -euo pipefail
          for file in qemuinstall.sh qemuuninstall.sh scripts/*.sh; do
            bash -n "$file"
          done

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          shellcheck -- qemuinstall.sh qemuuninstall.sh scripts/*.sh

      - name: Run IPv6 NAT regression test
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_ipv6_nat.sh
          bash tests/initialization_test.sh
          bash tests/noninteractive_mode_test.sh
          bash tests/image_source_test.sh
          bash tests/network_redefine_test.sh
          bash tests/disk_capacity_test.sh
          bash tests/cloudinit_seed_test.sh
          bash tests/readiness_budget_test.sh

      - name: Secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude='*.md' \
            -E 'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9_]{36,}' \
            .; then
            echo "Potential secret material found"
            exit 1
          fi
